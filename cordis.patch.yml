# dsh-flow-queue — visual flow queue.
#
# The Host half owns one flow graph per Session and advances it only at a turn
# boundary (`turn/end` plus an idle Agent), so a model switch can never land
# inside an in-flight request or one of its retries. The Client half registers a
# right-sidebar tab with the flow editor.
#
# The row names the package itself. A subpath row (`pkg/host2`) gives the client
# module system a row id that the bundle never registers under, and the whole
# client half then stays unloaded.
- insert:
    - id: flow-queue
      name: dsh-flow-queue
